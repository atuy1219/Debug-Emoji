name: Build module

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "module/**"
      - "scripts/**"
      - ".github/workflows/build.yml"
      - "UPSTREAM.md"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build module ZIP
        shell: bash
        run: |
          chmod +x scripts/build-module.sh
          ./scripts/build-module.sh

      - name: Show output
        shell: bash
        run: |
          ls -lh build/*.zip
          sha256sum build/*.zip

      - name: Upload module
        uses: actions/upload-artifact@v4
        with:
          name: OnePlus13-NotoEmoji-MountFix
          path: build/*.zip
          if-no-files-found: error
