name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36 SDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Build signed debug APK
        shell: bash
        run: |
          chmod +x ./build.sh
          ./build.sh build
          cp build/Debug-Emoji.apk Debug-Emoji.apk

      - name: APK info
        shell: bash
        run: |
          sha256sum Debug-Emoji.apk
          ls -lh Debug-Emoji.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Debug-Emoji-apk
          path: Debug-Emoji.apk
          if-no-files-found: error
          retention-days: 30
